name: Beta1 publication decision
run-name: beta1-publication ci-${{ inputs.ci_run_id }} closure-${{ inputs.final_closure_artifact_id }} packages-${{ inputs.installer_packages_artifact_id }}

on:
  workflow_dispatch:
    inputs:
      ci_run_id: {description: Successful exact beta1 CI run ID, required: true, type: string}
      final_closure_artifact_id: {description: Exact beta1-final-signed-closure artifact ID, required: true, type: string}
      final_closure_artifact_digest: {description: "Actions artifact digest sha256:...", required: true, type: string}
      final_closure_payload_sha256: {description: Canonical extracted closure SHA-256, required: true, type: string}
      installer_packages_artifact_id: {description: Exact beta1-installer-packages artifact ID, required: true, type: string}
      installer_packages_artifact_digest: {description: "Actions artifact digest sha256:...", required: true, type: string}
      installer_packages_payload_sha256: {description: Canonical extracted packages SHA-256, required: true, type: string}
      vehicle_evidence_artifact_id: {description: Trusted beta1-ci-vehicle-evidence ingestion artifact ID, required: true, type: string}
      vehicle_evidence_json_sha256: {description: SHA-256 of exact ingested evidence.json, required: true, type: string}
      vehicle_evidence_signature_sha256: {description: SHA-256 of raw signed payload signature, required: true, type: string}
      channel_url: {description: Existing immutable HTTPS channel.json URL for idempotent verification, required: false, type: string, default: ''}
      channel_signature_url: {description: Existing immutable HTTPS channel.json.sig URL for idempotent verification, required: false, type: string, default: ''}
      channel_json_sha256: {description: Expected existing channel.json SHA-256, required: false, type: string, default: ''}
      channel_signature_sha256: {description: Expected existing channel.json.sig SHA-256, required: false, type: string, default: ''}
      confirm_publication: {description: Decide to publish exact verified CI bytes without rebuild or resign, required: true, type: boolean, default: false}

permissions: {actions: read, contents: read}
concurrency:
  group: beta1-publication-decision
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beta1-publication-approval
    permissions: {actions: read, contents: read}
    outputs:
      product_sha: ${{ steps.verify.outputs.product_sha }}
      workflow_blob: ${{ steps.verify.outputs.workflow_blob }}
      source_definition_sha256: ${{ steps.verify.outputs.source_definition_sha256 }}
      trust_document_sha256: ${{ steps.verify.outputs.trust_document_sha256 }}
      closure_payload_sha256: ${{ steps.verify.outputs.closure_payload_sha256 }}
      packages_payload_sha256: ${{ steps.verify.outputs.packages_payload_sha256 }}
    steps:
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with: {toolchain: '1.98.0'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '24.13.0'}
      - name: Fail closed until the separate publication decision is enabled
        env: {CONFIRM: "${{ inputs.confirm_publication }}", ENABLED: "${{ vars.VOBOOST_BETA1_PUBLICATION_ENABLED }}"}
        run: |
          test "$CONFIRM" = true
          test "$ENABLED" = true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: "${{ github.workflow_sha }}", fetch-depth: 0, persist-credentials: false}
      - id: verify
        name: Verify CI identity, exact artifacts, and trusted clean vehicle evidence
        env:
          GH_TOKEN: "${{ github.token }}"
          CI_RUN_ID: "${{ inputs.ci_run_id }}"
          CLOSURE_ID: "${{ inputs.final_closure_artifact_id }}"
          CLOSURE_DIGEST: "${{ inputs.final_closure_artifact_digest }}"
          CLOSURE_PAYLOAD: "${{ inputs.final_closure_payload_sha256 }}"
          PACKAGES_ID: "${{ inputs.installer_packages_artifact_id }}"
          PACKAGES_DIGEST: "${{ inputs.installer_packages_artifact_digest }}"
          PACKAGES_PAYLOAD: "${{ inputs.installer_packages_payload_sha256 }}"
          EVIDENCE_ID: "${{ inputs.vehicle_evidence_artifact_id }}"
          EVIDENCE_JSON_SHA256: "${{ inputs.vehicle_evidence_json_sha256 }}"
          EVIDENCE_SIGNATURE_SHA256: "${{ inputs.vehicle_evidence_signature_sha256 }}"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          for id in "$CLOSURE_ID" "$PACKAGES_ID" "$EVIDENCE_ID"; do [[ "$id" =~ ^[1-9][0-9]*$ ]]; done
          for digest in "$CLOSURE_DIGEST" "$PACKAGES_DIGEST"; do [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; done
          for digest in "$CLOSURE_PAYLOAD" "$PACKAGES_PAYLOAD" "$EVIDENCE_JSON_SHA256" "$EVIDENCE_SIGNATURE_SHA256"; do [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          test "$(jq -r .status "$RUNNER_TEMP/ci-run.json")" = completed
          test "$(jq -r .conclusion "$RUNNER_TEMP/ci-run.json")" = success
          test "$(jq -r .event "$RUNNER_TEMP/ci-run.json")" = workflow_dispatch
          test "$(jq -r .head_branch "$RUNNER_TEMP/ci-run.json")" = main
          test "$(jq -r .path "$RUNNER_TEMP/ci-run.json")" = .github/workflows/beta1-ci.yml
          product_sha=$(jq -r .head_sha "$RUNNER_TEMP/ci-run.json")
          [[ "$product_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$product_sha"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/beta1-ci.yml?ref=$product_sha" > "$RUNNER_TEMP/workflow.json"
          workflow_blob=$(jq -r .sha "$RUNNER_TEMP/workflow.json")
          gh api "repos/$GITHUB_REPOSITORY/contents/release/1.0.0-beta1.toml?ref=$product_sha" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/source-definition.toml"
          source_definition_sha=$(sha256sum "$RUNNER_TEMP/source-definition.toml" | cut -d ' ' -f1)
          cargo run --manifest-path release/Cargo.toml --locked -- check-trust-roots release/1.0.0-beta1-trust.json
          test "$(jq -r .state release/1.0.0-beta1-trust.json)" = provisioned
          trust_document_sha=$(sha256sum release/1.0.0-beta1-trust.json | cut -d ' ' -f1)
          EVIDENCE_PUBLIC_KEY_HEX=$(jq -r .roots.evidencePublicKeyHex release/1.0.0-beta1-trust.json)
          [[ "$EVIDENCE_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "workflow_blob=$workflow_blob" >> "$GITHUB_OUTPUT"
          echo "source_definition_sha256=$source_definition_sha" >> "$GITHUB_OUTPUT"
          echo "trust_document_sha256=$trust_document_sha" >> "$GITHUB_OUTPUT"
          echo "closure_payload_sha256=$CLOSURE_PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "packages_payload_sha256=$PACKAGES_PAYLOAD" >> "$GITHUB_OUTPUT"
          for row in "closure|$CLOSURE_ID|$CLOSURE_DIGEST|beta1-final-signed-closure" "packages|$PACKAGES_ID|$PACKAGES_DIGEST|beta1-installer-packages"; do
            IFS='|' read -r name id digest expected_name <<< "$row"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/$name-meta.json"
            test "$(jq -r .name "$RUNNER_TEMP/$name-meta.json")" = "$expected_name"
            test "$(jq -r .expired "$RUNNER_TEMP/$name-meta.json")" = false
            test "$(jq -r .workflow_run.id "$RUNNER_TEMP/$name-meta.json")" = "$CI_RUN_ID"
            test "$(jq -r .digest "$RUNNER_TEMP/$name-meta.json")" = "$digest"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            test "sha256:$(sha256sum "$RUNNER_TEMP/$name.zip" | cut -d ' ' -f1)" = "$digest"
            mkdir "$RUNNER_TEMP/$name"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
          done
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/closure" -cf - . | sha256sum | cut -d ' ' -f1)" = "$CLOSURE_PAYLOAD"
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/packages" -cf - . | sha256sum | cut -d ' ' -f1)" = "$PACKAGES_PAYLOAD"
          node tools/beta1-evidence.ts inventory "$RUNNER_TEMP/closure" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/artifact-set.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ID" > "$RUNNER_TEMP/evidence-meta.json"
          test "$(jq -r .name "$RUNNER_TEMP/evidence-meta.json")" = beta1-ci-vehicle-evidence
          test "$(jq -r .expired "$RUNNER_TEMP/evidence-meta.json")" = false
          ingest_run=$(jq -r .workflow_run.id "$RUNNER_TEMP/evidence-meta.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ingest_run" > "$RUNNER_TEMP/ingest-run.json"
          test "$(jq -r .path "$RUNNER_TEMP/ingest-run.json")" = .github/workflows/beta1-evidence-ingest.yml
          test "$(jq -r .head_branch "$RUNNER_TEMP/ingest-run.json")" = main
          test "$(jq -r .head_sha "$RUNNER_TEMP/ingest-run.json")" = "$product_sha"
          test "$(jq -r .conclusion "$RUNNER_TEMP/ingest-run.json")" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ID/zip" > "$RUNNER_TEMP/evidence.zip"
          mkdir "$RUNNER_TEMP/evidence"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
          evidence="$RUNNER_TEMP/evidence/evidence.json"; signature="$RUNNER_TEMP/evidence/evidence-payload.sig"
          test "$(sha256sum "$evidence" | cut -d ' ' -f1)" = "$EVIDENCE_JSON_SHA256"
          test "$(sha256sum "$signature" | cut -d ' ' -f1)" = "$EVIDENCE_SIGNATURE_SHA256"
          jq -cS 'del(.producer)' "$evidence" > "$RUNNER_TEMP/payload.json"
          printf '%s' "$EVIDENCE_PUBLIC_KEY_HEX" | xxd -r -p > "$RUNNER_TEMP/evidence.pub"
          cargo run --manifest-path release/Cargo.toml --locked -- verify-file "$RUNNER_TEMP/evidence.pub" "$RUNNER_TEMP/payload.json" "$signature"
          jq -cn --arg workflowCommitSha "$product_sha" --arg workflowBlobSha "$(git rev-parse "$product_sha:.github/workflows/beta1-evidence-ingest.yml")" --arg runId "$ingest_run" --arg runAttempt "$(jq -r .run_attempt "$RUNNER_TEMP/ingest-run.json")" --arg commit "$product_sha" --arg ciWorkflowBlob "$workflow_blob" --arg definition "$source_definition_sha" --arg trust "$trust_document_sha" --arg ciRun "$CI_RUN_ID" --arg ciAttempt "$(jq -r .run_attempt "$RUNNER_TEMP/ci-run.json")" --arg closureId "$CLOSURE_ID" --arg closureDigest "$CLOSURE_DIGEST" --arg closurePayload "$CLOSURE_PAYLOAD" --arg packagesId "$PACKAGES_ID" --arg packagesDigest "$PACKAGES_DIGEST" --arg packagesPayload "$PACKAGES_PAYLOAD" --slurpfile inventory "$RUNNER_TEMP/artifact-set.json" '{producer:{workflowCommitSha:$workflowCommitSha,workflowBlobSha:$workflowBlobSha,runId:$runId,runAttempt:$runAttempt},product:{commit:$commit,workflowBlobSha:$ciWorkflowBlob,sourceDefinitionSha256:$definition,trustDocumentSha256:$trust},ci:{runId:$ciRun,runAttempt:$ciAttempt,finalClosure:{id:$closureId,digest:$closureDigest,payloadSha256:$closurePayload},installerPackages:{id:$packagesId,digest:$packagesDigest,payloadSha256:$packagesPayload}},artifactSet:$inventory[0]}' > "$RUNNER_TEMP/expected.json"
          node tools/beta1-evidence.ts ci "$evidence" "$RUNNER_TEMP/expected.json"

  publish-release:
    needs: admission
    if: ${{ inputs.confirm_publication && vars.VOBOOST_BETA1_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: beta1-publication
    permissions: {actions: read, contents: write}
    steps:
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with: {toolchain: '1.98.0'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '24.13.0'}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: "${{ needs.admission.outputs.product_sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Prove checkout clean before external bytes are downloaded
        run: test -z "$(git status --porcelain)"
      - name: Download exact admitted CI bytes outside checkout without rebuild or resign
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOSURE_ID: "${{ inputs.final_closure_artifact_id }}"
          CLOSURE_DIGEST: "${{ inputs.final_closure_artifact_digest }}"
          PACKAGES_ID: "${{ inputs.installer_packages_artifact_id }}"
          PACKAGES_DIGEST: "${{ inputs.installer_packages_artifact_digest }}"
          CLOSURE_PAYLOAD: "${{ needs.admission.outputs.closure_payload_sha256 }}"
          PACKAGES_PAYLOAD: "${{ needs.admission.outputs.packages_payload_sha256 }}"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-set" "$RUNNER_TEMP/closure-now" "$RUNNER_TEMP/packages-now"
          for row in closure:$CLOSURE_ID:$CLOSURE_DIGEST packages:$PACKAGES_ID:$PACKAGES_DIGEST; do
            name=${row%%:*}; tail=${row#*:}; id=${tail%%:*}; digest=${tail#*:}
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --jq .digest)" = "$digest"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            test "sha256:$(sha256sum "$RUNNER_TEMP/$name.zip" | cut -d ' ' -f1)" = "$digest"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name-now"
          done
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/closure-now" -cf - . | sha256sum | cut -d ' ' -f1)" = "$CLOSURE_PAYLOAD"
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/packages-now" -cf - . | sha256sum | cut -d ' ' -f1)" = "$PACKAGES_PAYLOAD"
          test "$(find "$RUNNER_TEMP/packages-now" -type f | wc -l | tr -d ' ')" = 4
          test "$(find "$RUNNER_TEMP/packages-now" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')" = "voboost-installer-1.0.0-beta1-arm64.dmg voboost-installer-1.0.0-beta1-x86_64.dmg voboost-installer-1.0.0-beta1.exe voboost-installer-1.0.0-beta1.tar.bz2 "
          cargo run --manifest-path release/Cargo.toml --locked -- check-trust-roots release/1.0.0-beta1-trust.json
          test "$(sha256sum release/1.0.0-beta1-trust.json | cut -d ' ' -f1)" = "${{ needs.admission.outputs.trust_document_sha256 }}"
          printf '%s' "$(jq -r .roots.productPublicKeyHex release/1.0.0-beta1-trust.json)" | xxd -r -p > "$RUNNER_TEMP/product.pub"
          cargo run --manifest-path release/Cargo.toml --locked -- verify-file "$RUNNER_TEMP/product.pub" "$RUNNER_TEMP/closure-now/voboost.json" "$RUNNER_TEMP/closure-now/voboost.json.sig"
          mkdir "$RUNNER_TEMP/device-now"
          jq -r '.artifacts[].file' "$RUNNER_TEMP/closure-now/voboost.json" | while IFS= read -r file; do cp "$RUNNER_TEMP/closure-now/$file" "$RUNNER_TEMP/device-now/"; done
          cargo run --manifest-path release/Cargo.toml --locked -- verify-manifest "$RUNNER_TEMP/closure-now/voboost.json" "$RUNNER_TEMP/device-now"
          cp -R "$RUNNER_TEMP/closure-now/." "$RUNNER_TEMP/release-set/"
          cp -R "$RUNNER_TEMP/packages-now/." "$RUNNER_TEMP/release-set/"
          test -f "$RUNNER_TEMP/release-set/voboost.json"
          test -f "$RUNNER_TEMP/release-set/voboost.json.sig"
          test -f "$RUNNER_TEMP/release-set/voboost-installer-1.0.0-beta1.exe"
          test -f "$RUNNER_TEMP/release-set/voboost-installer-1.0.0-beta1-arm64.dmg"
          test -f "$RUNNER_TEMP/release-set/voboost-installer-1.0.0-beta1-x86_64.dmg"
          test -f "$RUNNER_TEMP/release-set/voboost-installer-1.0.0-beta1.tar.bz2"
          ! find "$RUNNER_TEMP/release-set" -type f \( -name '*.key' -o -name '*.jks' -o -name '*.pem' \) | grep .
      - name: Resume or create exact tag and draft through authenticated GitHub APIs
        env:
          GH_TOKEN: "${{ github.token }}"
          PRODUCT_SHA: "${{ needs.admission.outputs.product_sha }}"
          CLOSURE_PAYLOAD: "${{ needs.admission.outputs.closure_payload_sha256 }}"
          PACKAGES_PAYLOAD: "${{ needs.admission.outputs.packages_payload_sha256 }}"
        run: |
          set -euo pipefail
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/closure-now" -cf - . | sha256sum | cut -d ' ' -f1)" = "$CLOSURE_PAYLOAD"
          test "$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/packages-now" -cf - . | sha256sum | cut -d ' ' -f1)" = "$PACKAGES_PAYLOAD"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-beta1" > "$RUNNER_TEMP/tag-ref.json" 2>/dev/null; then
            tag_object=$(jq -r .object.sha "$RUNNER_TEMP/tag-ref.json")
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$PRODUCT_SHA"
          else
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag=v1.0.0-beta1 -f message='Voboost 1.0.0-beta1' -f object="$PRODUCT_SHA" -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1.0.0-beta1 -f sha="$tag_object" >/dev/null
          fi
          if gh release view v1.0.0-beta1 --json isDraft,isPrerelease,name,tagName > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .tagName "$RUNNER_TEMP/release.json")" = v1.0.0-beta1
            test "$(jq -r .name "$RUNNER_TEMP/release.json")" = 'Voboost 1.0.0-beta1'
            test "$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")" = true
          else
            gh release create v1.0.0-beta1 --draft --prerelease --verify-tag --title 'Voboost 1.0.0-beta1'
            printf '%s\n' '{"isDraft":true,"isPrerelease":true,"name":"Voboost 1.0.0-beta1","tagName":"v1.0.0-beta1"}' > "$RUNNER_TEMP/release.json"
          fi
          release_is_draft=$(jq -r .isDraft "$RUNNER_TEMP/release.json")
          gh release view v1.0.0-beta1 --json assets > "$RUNNER_TEMP/assets.json"
          for path in "$RUNNER_TEMP/release-set"/*; do
            name=$(basename "$path")
            count=$(jq --arg name "$name" '[.assets[] | select(.name==$name)] | length' "$RUNNER_TEMP/assets.json")
            if test "$count" = 0; then
              test "$release_is_draft" = true
              gh release upload v1.0.0-beta1 "$path"
            else
              test "$count" = 1
              mkdir -p "$RUNNER_TEMP/remote-one"
              gh release download v1.0.0-beta1 --pattern "$name" --dir "$RUNNER_TEMP/remote-one"
              cmp "$path" "$RUNNER_TEMP/remote-one/$name"
              rm -f "$RUNNER_TEMP/remote-one/$name"
            fi
          done
          mkdir "$RUNNER_TEMP/remote-all"
          gh release download v1.0.0-beta1 --dir "$RUNNER_TEMP/remote-all"
          diff -qr "$RUNNER_TEMP/release-set" "$RUNNER_TEMP/remote-all"
          if test "$release_is_draft" = true; then
            gh release edit v1.0.0-beta1 --draft=false
          else
            echo "exact public prerelease already exists; publication is idempotently complete"
          fi

  update-channel:
    needs: [admission, publish-release]
    if: ${{ vars.VOBOOST_BETA1_CHANNEL_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: beta1-channel-publication
    permissions: {contents: read}
    steps:
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with: {toolchain: '1.98.0'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '24.13.0'}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: "${{ needs.admission.outputs.product_sha }}", persist-credentials: false}
      - name: Accept only an already-published exact signed channel after ambiguous success
        env:
          CHANNEL_URL: "${{ inputs.channel_url }}"
          CHANNEL_SIGNATURE_URL: "${{ inputs.channel_signature_url }}"
          CHANNEL_SHA256: "${{ inputs.channel_json_sha256 }}"
          CHANNEL_SIGNATURE_SHA256: "${{ inputs.channel_signature_sha256 }}"
        run: |
          set -euo pipefail
          [[ "$CHANNEL_URL" =~ ^https:// ]]
          [[ "$CHANNEL_SIGNATURE_URL" =~ ^https:// ]]
          [[ "$CHANNEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHANNEL_SIGNATURE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --proto '=https' --fail --silent --show-error --max-redirs 0 "$CHANNEL_URL" -o "$RUNNER_TEMP/channel.json"
          curl --proto '=https' --fail --silent --show-error --max-redirs 0 "$CHANNEL_SIGNATURE_URL" -o "$RUNNER_TEMP/channel.json.sig"
          test "$(sha256sum "$RUNNER_TEMP/channel.json" | cut -d ' ' -f1)" = "$CHANNEL_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/channel.json.sig" | cut -d ' ' -f1)" = "$CHANNEL_SIGNATURE_SHA256"
          cargo run --manifest-path release/Cargo.toml --locked -- check-trust-roots release/1.0.0-beta1-trust.json
          test "$(sha256sum release/1.0.0-beta1-trust.json | cut -d ' ' -f1)" = "${{ needs.admission.outputs.trust_document_sha256 }}"
          printf '%s' "$(jq -r .roots.productPublicKeyHex release/1.0.0-beta1-trust.json)" | xxd -r -p > "$RUNNER_TEMP/product.pub"
          cargo run --manifest-path release/Cargo.toml --locked -- verify-file "$RUNNER_TEMP/product.pub" "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/channel.json.sig"
          cargo run --manifest-path release/Cargo.toml --locked -- verify-channel "$RUNNER_TEMP/channel.json"
          test "$(jq -r .releaseIdentity "$RUNNER_TEMP/channel.json")" = 1.0.0-beta1
          echo "exact signed channel already exists; channel publication is idempotently complete"
