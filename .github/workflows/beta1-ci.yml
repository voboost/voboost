        run: |
          set -euo pipefail
          test "$(find packages -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          test "$(find packages -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')" = "voboost-installer-1.0.0-beta1-arm64.dmg voboost-installer-1.0.0-beta1-x86_64.dmg voboost-installer-1.0.0-beta1.exe voboost-installer-1.0.0-beta1.tar.bz2 "
          mkdir empty
          node tools/beta1-evidence.ts inventory empty packages package-inventory.json
          payload_sha=$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C packages -cf - . | sha256sum | cut -d ' ' -f1)
          echo "payload_sha256=$payload_sha" >> "$GITHUB_OUTPUT"
          file packages/voboost-installer-1.0.0-beta1.exe | grep -Eq 'PE32\+.*x86-64'
          node --input-type=module -e 'import { inspectSingleEntryTarBzip2 } from "./installer/src/build/offline-package.ts"; inspectSingleEntryTarBzip2("packages/voboost-installer-1.0.0-beta1.tar.bz2");'
          sha256sum packages/* > package-SHA256SUMS
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: beta1-installer-packages, path: packages/, if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta1-installer-package-verification
          path: |
            package-inventory.json
            package-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
