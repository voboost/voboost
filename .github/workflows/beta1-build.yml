name: Beta1 build artifacts
run-name: beta1 build ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      codestyle_sha:
        description: Full pushed voboost-codestyle commit
        required: true
        type: string

permissions: {contents: read}
concurrency:
  group: beta1-build-${{ github.sha }}-${{ inputs.codestyle_sha }}
  cancel-in-progress: false

defaults:
  run: {shell: bash}

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app: ${{ steps.pins.outputs.app }}
      agents: ${{ steps.pins.outputs.agents }}
      inject: ${{ steps.pins.outputs.inject }}
      installer: ${{ steps.pins.outputs.installer }}
      logo: ${{ steps.pins.outputs.logo }}
      codestyle: ${{ steps.pins.outputs.codestyle }}
    steps:
      - name: Admit only the committed main workflow
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.13.0', cache: npm}
      - run: npm ci --ignore-scripts
      - id: pins
        name: Resolve source pins from the committed release definition
        env: {CODESTYLE_SHA: "${{ inputs.codestyle_sha }}"}
        run: |
          cmp release/version.toml release/1.0.0-beta1.toml
          node tools/release/ci-build.ts pins release/version.toml "$CODESTYLE_SHA"

  closure:
    needs: sources
    runs-on: macos-15
    timeout-minutes: 120
    environment: beta1-build
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost
          ref: "${{ github.sha }}"
          path: voboost
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-app
          ref: "${{ needs.sources.outputs.app }}"
          path: voboost-app
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-agents
          ref: "${{ needs.sources.outputs.agents }}"
          path: voboost-agents
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-inject
          ref: "${{ needs.sources.outputs.inject }}"
          path: voboost-inject
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-installer
          ref: "${{ needs.sources.outputs.installer }}"
          path: voboost-installer
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-logo
          ref: "${{ needs.sources.outputs.logo }}"
          path: voboost-logo
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-codestyle
          ref: "${{ needs.sources.outputs.codestyle }}"
          path: voboost-codestyle
          submodules: recursive
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.13.0', cache: npm, cache-dependency-path: voboost/package-lock.json}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.0', targets: aarch64-linux-android, components: rust-src}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Prepare pinned source build tools
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci/scratch"
          echo "TMPDIR=$GITHUB_WORKSPACE/.ci/scratch" >> "$GITHUB_ENV"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
          (cd voboost && npm ci --ignore-scripts)
          (cd voboost-inject && npm ci --ignore-scripts)
          (cd voboost-installer && npm ci --ignore-scripts)
          # QNX compiles core/alloc offline; provision the exact workspace and
          # sysroot dependencies before the signing authority is imported.
          RUSTC_BOOTSTRAP=1 cargo +1.98.0 fetch --locked --manifest-path voboost-inject/Cargo.toml --target aarch64-unknown-nto-qnx700 -Zbuild-std=core,alloc
      - name: Validate audited QNX link interfaces before signing authority is materialized
        run: |
          set -euo pipefail
          (cd voboost-agents && ./gradlew verifyQnxLinkInterfaces --offline --no-daemon --console=plain)
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { parseBuildClosureConfig } from './voboost/tools/release/build-closure.ts';
          const root = process.env.GITHUB_WORKSPACE;
          const config = parseBuildClosureConfig({workspaceRoot: root, output: `${root}/voboost/build/beta1-ci`, authorityDir: `${root}/.ci/authority`, androidSdkRoot: process.env.ANDROID_SDK_ROOT, androidNdkHome: process.env.ANDROID_NDK_HOME, androidNdkRevision: '29.0.14206865', profile: 'machine', sourceMode: 'exact-source', agentSet: 'release'});
          writeFileSync(`${root}/.ci/build.json`, JSON.stringify(config));
          NODE
      - name: Admit and materialize CI-only beta signing authority
        env:
          KEY_AGENT_CATALOG: "${{ secrets.VOBOOST_BETA1_AGENTS_SIGNING_KEY }}"
          KEY_PRODUCT: "${{ secrets.VOBOOST_BETA1_PRODUCT_SIGNING_KEY }}"
          KEY_NATIVE_EXECUTABLE: "${{ secrets.VOBOOST_BETA1_NATIVE_EXECUTABLE_SIGNING_KEY }}"
          KEY_RESTORE: "${{ secrets.VOBOOST_BETA1_RESTORE_SIGNING_KEY }}"
          APP_KEYSTORE: "${{ secrets.VOBOOST_BETA1_ANDROID_KEYSTORE_BASE64 }}"
        run: node voboost/tools/release/ci-build.ts authority "$GITHUB_WORKSPACE/.ci/authority"
      - name: Build new machine closure from exact clean source commits
        run: |
          set -euo pipefail
          node voboost/tools/release/build-closure.ts "$GITHUB_WORKSPACE/.ci/build.json"
          node voboost/tools/release/ci-build.ts public-inputs "$GITHUB_WORKSPACE/voboost" "$GITHUB_WORKSPACE/.ci/authority" "$GITHUB_WORKSPACE/voboost/build/beta1-ci/public-inputs"
      - name: Remove private signing material
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.ci/authority"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta1-build-inputs
          path: |
            voboost/build/beta1-ci/closure/
            voboost/build/beta1-ci/inputs/
            voboost/build/beta1-ci/public-inputs/
            voboost/build/beta1-ci/receipt.json
            voboost/build/beta1-ci/closure-inventory.json
            voboost/build/beta1-ci/apk-evidence.json
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [sources, closure]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: macos, filename: voboost-installer-1.0.0-beta1.dmg, artifact: "voboost-installer-1.0.0-beta1-*.dmg"}
          - {runner: windows-2025, platform: windows, filename: voboost-installer-1.0.0-beta1.exe, artifact: voboost-installer-1.0.0-beta1.exe}
          - {runner: ubuntu-24.04, platform: linux, filename: voboost-installer-1.0.0-beta1.tar.bz2, artifact: voboost-installer-1.0.0-beta1.tar.bz2}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env: {RUSTUP_TOOLCHAIN: '1.98.0', VOBOOST_PRODUCT_VERSION: '1.0.0-beta1'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-installer
          ref: "${{ needs.sources.outputs.installer }}"
          path: installer
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - name: Checkout exact shared host sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: voboost/voboost-inject
          ref: "${{ needs.sources.outputs.inject }}"
          path: voboost-inject
          sparse-checkout: |
            common/contracts
            common/qconn
            contract
            shared
          persist-credentials: false
          token: "${{ secrets.VOBOOST_SOURCE_READ_TOKEN || github.token }}"
      - name: Admit exact shared host sources
        run: |
          set -euo pipefail
          test "$(git -C voboost-inject rev-parse HEAD)" = "${{ needs.sources.outputs.inject }}"
          test -z "$(git -C voboost-inject status --porcelain=v1)"
          test -f voboost-inject/common/contracts/Cargo.toml
          test -f voboost-inject/common/qconn/Cargo.toml
          test -f voboost-inject/contract/Cargo.toml
          test -f voboost-inject/shared/Cargo.toml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.13.0', cache: npm, cache-dependency-path: installer/package-lock.json}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.0'}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: beta1-build-inputs, path: bundle}
      - name: Install Linux CLI packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils bzip2 file strace pkg-config libssl-dev
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.98.0 aarch64-apple-darwin x86_64-apple-darwin
      - name: Package and independently reopen the final installer
        env: {PLATFORM: "${{ matrix.platform }}", FILENAME: "${{ matrix.filename }}"}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci/scratch" "$GITHUB_WORKSPACE/packages"
          export TMPDIR="$GITHUB_WORKSPACE/.ci/scratch"
          (cd installer && npm ci --ignore-scripts)
          node installer/src/build/ci-package.ts "$PLATFORM" "$GITHUB_WORKSPACE/bundle" "$GITHUB_WORKSPACE/bundle/public-inputs" "$GITHUB_WORKSPACE/packages/$FILENAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta1-build-${{ matrix.platform }}
          path: packages/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
